  ${card('Anotações rápidas', `<textarea id="notes" class="notes" placeholder="Escreva aqui...">${esc(Store.get('notes', ''))}</textarea>`, 'c-rose span2', 'doc')}
  </div></div>
  <aside class="stack">${card('Calendário', calendar(), '', 'cal')}${card(`Linha do tempo · ${dm(selD)}`, timeline(), '', 'loop')}</aside></div>`;
}

/* Páginas em construção e configurações */
function page(p) {
  const [id, title, icon, desc, soon] = p;
  if (id === 'tarefas') return topbar() + Tasks.page(p);
  if (id === 'financeiro') return topbar() + Fin.page(p);
  if (id === 'projetos') return topbar() + Tasks.projects(p);
  if (id === 'trabalho') return topbar() + Work.page(p);
  if (id === 'estudos') return topbar() + Study.page(p);
  if (id === 'ideias') return topbar() + Ideas.page(p);
  if (id === 'agenda') return topbar() + Agenda.page(p);
  if (id === 'habitos') return topbar() + Hab.page(p);
  let body = '';
  if (id === 'configuracoes') {
    const c = Store.get('settings', {});
    body = card('Perfil', `<label class="f">Como devo chamar você na saudação?<input id="nome" value="${esc(c.nome || '')}"></label><label class="f">Frase ou versículo da página inicial<input id="frase" value="${esc(c.frase || '')}"></label><div class="row"><button class="btn" id="save">Salvar</button></div>`, '', 'user') + Backup.card();
  } else {
    body = card('Em breve nesta seção', `<ul>${soon.map(s => `<li>${s}</li>`).join('')}</ul>`, 'soon', icon);
  }
  return `${topbar()}<header class="page-head"><i class="ci lg">${ico(icon)}</i><h1>${title}</h1><p>${desc}</p></header><div class="grid">${body}</div>`;
}

/* Navegação e desenho da tela */
function current() { const id = location.hash.slice(1) || 'inicio'; return PAGES.find(p => p[0] === id) || PAGES[0]; }
const link = (p, on) => `<a href="#${p[0]}" class="${on ? 'on' : ''}" title="${p[1]}">${ico(p[2])}<span>${p[1]}</span></a>`;

function render() {
  const cur = current(), mini = Store.get('ui', {}).mini;
  document.body.classList.toggle('mini', !!mini);
  const grp = (t, a) => `<div class="glabel">${t}</div>` + a.map(p => link(p, p === cur)).join('');
  $('#side').innerHTML = `<div class="brand"><span class="logo">M</span><div>Meu Planner<small>Organização pessoal</small></div><button class="collapse" id="collapse" aria-label="Recolher menu">${ico('chevL')}</button></div>` +
    grp('Geral', PAGES.slice(0, 7)) + grp('Vida', PAGES.slice(7, 15)) + `<div class="foot">${link(PAGES[15], PAGES[15] === cur)}</div>`;
  const main = ['inicio', 'agenda', 'tarefas', 'financeiro'].map(id => PAGES.find(p => p[0] === id));
  $('#tabs').innerHTML = main.map(p => link(p, p === cur)).join('') + `<button id="more">${ico('more')}<span>Mais</span></button>`;
  $('#sheet').innerHTML = `<div class="panel">${PAGES.map(p => link(p, p === cur)).join('')}</div>`;
  $('#sheet').hidden = true;
  $('#main').innerHTML = cur[0] === 'inicio' ? home() : page(cur);
  document.title = cur[1] + ' · Meu Planner';
  if (typeof Ideas !== 'undefined') Ideas.hydrate();
}

document.addEventListener('click', e => {
  const t = e.target, b = t.closest('button');
  if (t.closest('#more')) $('#sheet').hidden = false;
  else if (t.id === 'sheet') $('#sheet').hidden = true;
  if (t.closest('#collapse')) { Store.set('ui', { ...Store.get('ui', {}), mini: !Store.get('ui', {}).mini }); render(); return; }
  if (b && b.dataset.day) { selD = b.dataset.day; calM = selD.slice(0, 7); render(); return; }
  if (b && b.dataset.cal) { const [y, m] = calM.split('-').map(Number), d = new Date(y, m - 1 + Number(b.dataset.cal), 1); calM = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; render(); return; }
  if (!t.closest('.search')) { const r = $('#qres'); if (r) r.hidden = true; }
  if (t.dataset.new === 'task') Tasks.form(); else if (t.dataset.new === 'expense') Fin.form('despesa'); else if (t.dataset.new === 'income') Fin.form('receita'); else if (t.dataset.new === 'event') Agenda.form(); else if (t.dataset.new) openForm(t.dataset.new);
  if (t.id === 'save') { Store.set('settings', { ...Store.get('settings', {}), nome: $('#nome').value.trim(), frase: $('#frase').value.trim() }); t.textContent = 'Salvo'; }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  const q = e.target.value.trim().toLowerCase(), r = $('#qres');
  if (!q) { r.hidden = true; return; }
  const hit = [...Store.list('tasks').map(x => ['tarefas', x.title, 'Tarefa']), ...Store.list('events').map(x => ['agenda', x.title, 'Compromisso'])].filter(x => String(x[1]).toLowerCase().includes(q)).slice(0, 6);
  r.innerHTML = hit.length ? hit.map(x => `<a href="#${x[0]}">${esc(x[1])}<small>${x[2]}</small></a>`).join('') : '<a>Nada encontrado</a>';
  r.hidden = false;
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'notes') Store.set('notes', t.value);
  if (t.dataset.task) { Tasks.complete(t.dataset.task); render(); }
  if (t.dataset.habit) {
    const b = Store.list('habits').find(x => x.id === t.dataset.habit), hoje = Store.today();
    const days = new Set(b.doneDates || []); t.checked ? days.add(hoje) : days.delete(hoje);
    Store.update('habits', b.id, { doneDates: [...days] }); render();
  }
});

/* Confirmação e aviso dentro da página (o confirm/alert do navegador é bloqueado em alguns ambientes, como o chat) */
function ask(msg, yes, label = 'Excluir') {
  let d = document.getElementById('askdlg'); if (!d) { d = document.createElement('dialog'); d.id = 'askdlg'; document.body.appendChild(d); }
  d.innerHTML = `<p style="margin:0 0 4px;font-weight:600;font-size:16px;white-space:pre-line">${esc(msg)}</p><div class="row"><button type="button" class="btn ghost" id="ask-no">Cancelar</button><button type="button" class="btn" id="ask-yes">${esc(label)}</button></div>`;
  d.querySelector('#ask-no').onclick = () => d.close(); d.querySelector('#ask-yes').onclick = () => { d.close(); yes(); };
  if (!d.open) d.showModal(); d.querySelector('#ask-no').focus();
}
function notify(msg) {
  let box = document.getElementById('toasts'); if (!box) { box = document.createElement('div'); box.id = 'toasts'; document.body.appendChild(box); }
  const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = `<div style="white-space:pre-line">${esc(String(msg))}</div><button class="btn sm ghost" data-ag="toastx" aria-label="Fechar">×</button>`; box.appendChild(el); setTimeout(() => el.remove(), 10000);
}
/* Cores dos status (só tons da paleta): a cor depende do texto da etiqueta */
const STATUS_COR = {
  'st-todo': ['nao iniciada', 'nova', 'pendente', 'desejado', 'quero comprar'],
  'st-wait': ['aguardando cliente', 'aguardando revisao', 'aguardando', 'em analise', 'pausado', 'pausada', 'planejado', 'planejada', 'pesquisando', 'enviada', 'em elaboracao', 'programada'],
  'st-prog': ['em andamento', 'em desenvolvimento', 'parcial'],
  'st-done': ['concluido', 'concluida', 'recebido', 'realizada', 'realizado', 'adquirido', 'comprado', 'aprovada', 'assinado', 'feito', 'pago'],
  'st-bad': ['atrasado', 'atrasada', 'cancelado', 'cancelada', 'desistido', 'recusada', 'expirada']
};
const STATUS_MAP = Object.fromEntries(Object.entries(STATUS_COR).flatMap(([c, l]) => l.map(t => [t, c])));
function colorTags(root = document) {
  root.querySelectorAll('.tag:not([data-st])').forEach(el => {
    el.dataset.st = '1'; if (/(^|\s)p-/.test(el.className)) return;
    const c = STATUS_MAP[el.textContent.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')]; if (c) el.classList.add(c);
  });
}
new MutationObserver(() => colorTags()).observe(document.body, { childList: true, subtree: true });
/* SINCRONIZAÇÃO SUPABASE — cada coleção é um registro privado por usuário. */
const Cloud = {
  client:null, user:null, ready:false, pending:new Map(), timers:new Map(), muted:false, lastPull:0,
  async init(){
    if (!window.supabase) { this.screen('Não foi possível carregar a conexão. Verifique a internet e recarregue.'); return; }
    this.client=window.supabase.createClient('https://tkyjtanhggkzyxqkcblx.supabase.co','sb_publishable_pShfDyt90-gxMdSXSEznKA_ECwues7o', {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const {data:{session}}=await this.client.auth.getSession();
    if(session?.user) await this.enter(session.user); else this.screen();
    this.client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){this.user=null;this.ready=false;this.clearLocal();this.screen();}});
  },
  screen(msg=''){
    this.ready=false;
    document.getElementById('main').innerHTML='';
    let el=document.getElementById('cloud-login');
    if(!el){el=document.createElement('div');el.id='cloud-login';document.body.appendChild(el);}
    el.innerHTML=`<div class="cloud-card"><h1>Meu Planner</h1><p>Entre para acessar seus dados sincronizados.</p><form id="cloud-form"><label class="f">E-mail<input type="email" name="email" required autocomplete="email"></label><label class="f">Senha<input type="password" name="password" minlength="6" required autocomplete="current-password"></label><p id="cloud-error" style="color:#6B0B0C">${msg.replace(/</g,'&lt;')}</p><div class="cloud-buttons"><button type="submit" class="btn" data-mode="login">Entrar</button><button type="button" class="btn ghost" id="cloud-signup">Criar conta</button></div></form><p style="font-size:12px;color:#655">Use o mesmo e-mail nos dois aparelhos. Seu backup ainda não foi importado.</p></div>`;
    el.querySelector('#cloud-form').onsubmit=e=>{e.preventDefault();this.authenticate(false)};
    el.querySelector('#cloud-signup').onclick=()=>this.authenticate(true);
  },
  async authenticate(signup){
    const el=document.getElementById('cloud-login'),f=el.querySelector('form'),email=f.email.value.trim(),password=f.password.value;
    const err=el.querySelector('#cloud-error');err.textContent='Aguarde…';
    try{
      const {data,error}=signup?await this.client.auth.signUp({email,password}):await this.client.auth.signInWithPassword({email,password});
      if(error)throw error;
      if(!data.session){err.textContent='Conta criada! Confira seu e-mail para confirmar o cadastro e depois entre.';return;}
      await this.enter(data.user);
    }catch(e){err.textContent='Não foi possível entrar: '+e.message;}
  },
  clearLocal(){for(const k of Object.keys(localStorage))if(k.startsWith('planner:'))localStorage.removeItem(k);},
  async enter(user){
    this.user=user;this.ready=false;
    try{
      const {data,error}=await this.client.from('planner_data').select('collection,data').eq('user_id',user.id);
      if(error)throw error;
      this.muted=true;this.clearLocal();
      for(const row of data||[])localStorage.setItem('planner:'+row.collection,JSON.stringify(row.data));
      this.muted=false;
      this.ready=true;
      document.getElementById('cloud-login')?.remove();
      document.body.classList.add('cloud-on');
      Tasks.normalize();Fin.normalize();render();
      this.status();
      if(this.poll)clearInterval(this.poll);
      this.poll=setInterval(()=>this.refresh().catch(console.warn),12000);
    }catch(e){this.muted=false;this.screen('Falha ao carregar seus dados: '+e.message);}
  },
  status(message='Sincronização ativa'){
    let el=document.getElementById('cloud-status');if(!el){el=document.createElement('div');el.id='cloud-status';document.body.appendChild(el);}
    el.textContent=message;
    el.onclick=()=>{if(confirm('Sair da sua conta neste aparelho?'))this.client.auth.signOut()};
    el.title='Toque para sair da conta';
  },
  save(name,value){
    if(!this.ready||this.muted||!this.user)return;
    this.pending.set(name,structuredClone(value));
    clearTimeout(this.timers.get(name));
    this.timers.set(name,setTimeout(()=>this.flush(name),450));
  },
  async flush(name){
    if(!this.pending.has(name)||!this.user)return;
    const data=this.pending.get(name);this.pending.delete(name);
    const {error}=await this.client.from('planner_data').upsert({user_id:this.user.id,collection:name,data,updated_at:new Date().toISOString()},{onConflict:'user_id,collection'});
    if(error){this.pending.set(name,data);this.status('Falha ao salvar — toque para sair; verifique a conexão');console.error(error);}
    else if(!this.pending.size)this.status();
  },
  async flushAll(){
    for(const name of [...this.pending.keys()]){clearTimeout(this.timers.get(name));await this.flush(name);}
    if(this.pending.size)throw Error('Alguns dados não foram enviados. Verifique sua internet.');
  },
  async refresh(){
    if(!this.ready||this.pending.size||document.querySelector('dialog[open]')||document.activeElement?.matches('input,textarea,select'))return;
    const {data,error}=await this.client.from('planner_data').select('collection,data').eq('user_id',this.user.id);
    if(error)return;
    let changed=false;this.muted=true;
    for(const row of data){const k='planner:'+row.collection,v=JSON.stringify(row.data);if(localStorage.getItem(k)!==v){localStorage.setItem(k,v);changed=true;}}
    this.muted=false;if(changed)render();
  },
  async upload(id,blob){
    if(!this.user)throw Error('Entre na sua conta');
    const path=this.user.id+'/'+encodeURIComponent(id);
    const {error}=await this.client.storage.from('planner-private').upload(path,blob,{upsert:true,contentType:blob.type||'application/octet-stream'});
    if(error)throw error;
  },
  async download(id){
    if(!this.user)return null;
    const {data,error}=await this.client.storage.from('planner-private').download(this.user.id+'/'+encodeURIComponent(id));
    if(error)return null;return data;
  },
  async deleteFile(id){if(this.user)await this.client.storage.from('planner-private').remove([this.user.id+'/'+encodeURIComponent(id)]);},
  async importBackup(info){
    if(!this.ready)throw Error('Entre na conta antes de importar');
    const {count,error}=await this.client.from('planner_data').select('*',{count:'exact',head:true}).eq('user_id',this.user.id);
    if(error)throw error;
    if(count>0&&!confirm('A conta já tem dados na nuvem. Substituir pelo backup?'))return false;
    this.status('Importando backup para a nuvem…');
    for(const [id,blob] of info.blobs)await this.upload(id,blob);
    for(const [k,v] of Object.entries(info.chaves)){
      const {error}=await this.client.from('planner_data').upsert({user_id:this.user.id,collection:k.slice(8),data:JSON.parse(v)},{onConflict:'user_id,collection'});
      if(error)throw error;
    }
    this.status();return true;
  }
};
const originalSet=Store.set.bind(Store);
Store.set=function(name,value){originalSet(name,value);Cloud.save(name,value)};
const originalPut=Files.put.bind(Files),originalGet=Files.get.bind(Files),originalDel=Files.del.bind(Files);
Files.put=async function(id,blob){await Cloud.upload(id,blob);try{await originalPut(id,blob)}catch(e){}return id};
Files.get=async function(id){let b=await originalGet(id).catch(()=>null);if(!b)b=await Cloud.download(id);return b};
Files.del=async function(id){await Cloud.deleteFile(id);return originalDel(id).catch(()=>{})};
const originalEntries=Files.entries.bind(Files);
Files.entries=async function(){const local=await originalEntries().catch(()=>[]),out=new Map(local);if(Cloud.user){const {data,error}=await Cloud.client.storage.from('planner-private').list(Cloud.user.id,{limit:1000});if(!error)for(const f of data||[]){const id=decodeURIComponent(f.name);if(!out.has(id)){const blob=await Cloud.download(id);if(blob)out.set(id,blob)}}}return [...out]};
const originalBackupApply=Backup.aplicar.bind(Backup);
Backup.aplicar=async function(info){if(!(await Cloud.importBackup(info)))return;await originalBackupApply(info);await Cloud.enter(Cloud.user)};
window.addEventListener('online',()=>Cloud.flushAll().catch(console.warn));
window.addEventListener('hashchange',()=>{if(Cloud.ready){render();scrollTo(0,0)}});
Cloud.init();


</script>
