<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Meu Planner — identidade visual. Paleta fixa: chiffon, rosewood, coffee bean, botticelli */
:root{
  --rose:#6B0B0C; --bean:#2D120D; --blue:#CDE3E8;
  --chiffon:color-mix(in srgb,var(--blue) 28%,#fff);
  --bg:color-mix(in srgb,var(--blue) 13%,#fff);
  --card:#fff; --line:color-mix(in srgb,var(--bean) 11%,#fff);
  --muted:color-mix(in srgb,var(--bean) 58%,#fff);
  --soft:color-mix(in srgb,var(--blue) 50%,#fff);
  --shadow:0 1px 2px rgba(45,18,13,.05),0 8px 24px rgba(45,18,13,.05);
  --sans:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif; --side:252px;
  color-scheme:light; box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--bean);font:400 15px/1.5 var(--sans)}
body.mini{--side:80px}
h1,h2,h3{font-family:var(--sans);color:var(--bean);margin:0;font-weight:700;line-height:1.2;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
svg{width:20px;height:20px;flex:none}
u{text-decoration:none}

/* Menu lateral */
#side{position:fixed;inset:0 auto 0 0;width:var(--side);padding:22px 14px;overflow-y:auto;background:var(--bean);
  color:var(--chiffon);display:flex;flex-direction:column;gap:2px;transition:width .25s ease;z-index:6;
  border-radius:0 26px 26px 0}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px;font-weight:800;font-size:19px;letter-spacing:-.03em;position:relative}
.brand small{display:block;font:500 11.5px var(--sans);color:color-mix(in srgb,var(--chiffon) 55%,transparent);letter-spacing:0}
.logo{width:40px;height:40px;border-radius:13px;background:var(--rose);color:var(--chiffon);display:grid;place-items:center;font-weight:800;flex:none}
.collapse{position:absolute;right:-6px;top:12px;width:26px;height:26px;border-radius:50%;border:0;background:var(--blue);color:var(--bean);cursor:pointer;display:grid;place-items:center;padding:0}
.collapse svg{width:15px;height:15px;transition:transform .25s}
.glabel{font-size:11.5px;font-weight:600;color:color-mix(in srgb,var(--chiffon) 45%,transparent);padding:14px 12px 6px;text-transform:uppercase;letter-spacing:.08em}
#side a,#sheet a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;color:color-mix(in srgb,var(--chiffon) 82%,transparent);text-decoration:none;font-size:14.5px;font-weight:500;transition:background .15s,color .15s}
#side a:hover{background:color-mix(in srgb,var(--chiffon) 10%,transparent);color:var(--chiffon)}
#side a.on{background:var(--rose);color:var(--chiffon);font-weight:600}
#side .foot{margin-top:auto;padding-top:12px}
body.mini #side .brand div,body.mini #side a span,body.mini .glabel{display:none}
body.mini #side a{justify-content:center}body.mini .brand{justify-content:center}
body.mini .collapse svg{transform:rotate(180deg)}

/* Cabeçalho */
#main{margin-left:var(--side);padding:22px clamp(18px,3vw,40px) 56px;transition:margin .25s ease}
.top{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.search{position:relative;flex:1;max-width:560px}
.search>label{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 6px}
.search .sb{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--rose);display:grid;place-items:center}
.search input{border:0;outline:0;background:none;flex:1;min-width:0}
#qres{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:6px;z-index:8;display:grid;gap:2px}
#qres a{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:12px;color:var(--bean);text-decoration:none;font-size:14px}
#qres a:hover{background:var(--soft)}#qres small{color:var(--muted)}
.topr{display:flex;gap:8px;margin-left:auto}
.ib{position:relative;width:42px;height:42px;border-radius:50%;background:var(--bean);color:var(--chiffon);display:grid;place-items:center;text-decoration:none;border:0;cursor:pointer;font-weight:700;transition:transform .15s,background .15s}
.ib:hover{background:var(--rose);transform:translateY(-1px)}.ib:active{transform:scale(.94)}
.ib b{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--rose);color:var(--chiffon);font-size:11px;display:grid;place-items:center;border:2px solid var(--bg)}

/* Títulos de página */
.page-head{margin-bottom:24px;display:grid;gap:4px}
.page-head h1{font-size:clamp(28px,4vw,38px)}
.page-head p{color:var(--muted);margin:0;max-width:62ch}
.ci{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--rose);display:grid;place-items:center;flex:none;font-style:normal}
.ci svg{width:17px;height:17px}.ci.lg{width:48px;height:48px;margin-bottom:8px}.ci.lg svg{width:23px;height:23px}
.hero h1{font-size:clamp(30px,4.4vw,44px)}
.hero p{margin:8px 0 0;color:var(--muted);max-width:62ch}
.hero .date::first-letter{text-transform:uppercase}.hero .date{font-weight:600;color:var(--rose);margin-bottom:6px}
.verse{margin-top:14px;display:inline-block;background:var(--chiffon);border-radius:14px;padding:8px 14px;font-size:13.5px;color:var(--bean)}
.quick{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 26px}
.quick button{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--bean);color:var(--chiffon);padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;transition:background .15s,transform .1s}
.quick button svg{width:16px;height:16px}.quick button:hover{background:var(--rose)}.quick button:active{transform:scale(.96)}

/* Dashboard */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
.g2,.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.span2{grid-column:1/-1}
.stack{display:grid;gap:18px}

/* Cards */
.card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.card>*{position:relative;z-index:1}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ch h2{font-size:16px;flex:1}.card h2{font-size:17px;margin-bottom:12px}.ch h2{margin:0}
.ch .more{font-size:12.5px;font-weight:600;color:inherit;opacity:.7;text-decoration:none;padding:5px 12px;border-radius:999px;border:1px solid currentColor}
.ch .more:hover{opacity:1}
.c-yel{background:color-mix(in srgb,var(--blue) 34%,#fff);border-color:transparent}
.c-blue{background:var(--blue);border-color:transparent}
.c-rose{background:var(--rose);color:var(--chiffon);border-color:transparent}
.c-dark{background:var(--bean);color:var(--chiffon);border-color:transparent}
.c-dark h2,.c-dark .meta,.c-dark .empty{color:var(--chiffon)}
.c-yel .ci,.c-blue .ci{background:rgba(255,255,255,.6)}
.c-dark .ci{background:var(--rose);color:var(--chiffon)}
.c-yel::after,.c-blue::after,.c-rose::after,.c-dark::after{content:"";position:absolute;right:-24px;top:-24px;width:104px;height:104px;background:rgba(45,18,13,.07);border-radius:50%;pointer-events:none}
.c-blue::after{border-radius:0;clip-path:polygon(50% 0,61% 28%,92% 20%,72% 45%,100% 62%,66% 66%,64% 100%,45% 72%,12% 88%,28% 56%,0 36%,34% 34%);right:-14px;top:-14px;background:rgba(45,18,13,.09)}
.c-rose::after{border-radius:0;clip-path:polygon(0 0,100% 0,50% 100%);background:rgba(107,11,12,.11)}
.c-dark::after{background:rgba(205,227,232,.07)}
@media (prefers-reduced-motion:no-preference){.card{transition:box-shadow .2s,transform .2s}.card:hover{box-shadow:0 14px 34px rgba(45,18,13,.10);transform:translateY(-2px)}}
.card.warn{border-color:color-mix(in srgb,var(--rose) 45%,#fff)}
.empty{color:var(--muted);font-size:14px;margin:0;padding:16px;border:1.5px dashed color-mix(in srgb,currentColor 20%,transparent);border-radius:16px;text-align:center}
.c-dark .empty{border-color:rgba(205,227,232,.25)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list li{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,255,255,.6);border-radius:14px;flex-wrap:wrap}
.card:not([class*=c-]) .list li{background:color-mix(in srgb,var(--blue) 20%,#fff)}
.c-dark .list li{background:rgba(205,227,232,.09)}
.list .meta,.meta{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
.list input[type=checkbox]{appearance:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--rose);background:#fff;cursor:pointer;display:grid;place-items:center;transition:background .15s,transform .15s;flex:none;margin:0}
.list input[type=checkbox]:checked{background:var(--rose)}
.list input[type=checkbox]:checked::after{content:"";width:5px;height:9px;border:solid var(--chiffon);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.list input[type=checkbox]:active{transform:scale(.85)}
.c-dark .list input[type=checkbox]{border-color:var(--chiffon);background:transparent}
.done{text-decoration:line-through;color:var(--muted)}
.big{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.money div{background:rgba(255,255,255,.62);border-radius:16px;padding:12px 10px}
.money b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em}
.money span{font-size:12px;color:var(--muted)}
.ring{width:84px;height:84px;position:relative;flex:none}.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:800}
.row2{display:flex;align-items:center;gap:16px}.row2 p{margin:0;font-size:13px;opacity:.8}
.wk{display:flex;gap:5px;margin-left:auto}
.wk i{width:18px;height:18px;border-radius:50%;background:rgba(45,18,13,.12)}.wk i.y{background:var(--rose)}
.wk input[type=checkbox]{width:22px!important;height:22px!important}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stats div{background:rgba(255,255,255,.7);border-radius:16px;padding:14px}
.stats b{display:block;font-size:28px;font-weight:800;letter-spacing:-.03em}.stats span{font-size:12.5px;color:var(--muted)}
.notes{width:100%;min-height:110px;border:0;border-radius:14px;background:rgba(255,255,255,.65);padding:12px;resize:vertical}

/* Calendário e linha do tempo */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-h b::first-letter{text-transform:uppercase}.cal-h b{background:var(--soft);color:var(--rose);padding:5px 16px;border-radius:999px;font-size:13.5px}
.cal-h button{width:34px;height:34px;border-radius:50%;border:0;background:none;cursor:pointer;display:grid;place-items:center}.cal-h button:hover{background:var(--soft)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-g span{font-size:11.5px;font-weight:700;color:var(--muted);padding:4px 0}
.cal-g button{position:relative;aspect-ratio:1;border:0;background:none;border-radius:50%;cursor:pointer;font-size:13.5px;transition:background .15s}
.cal-g button:hover{background:var(--soft)}
.cal-g button.today{box-shadow:inset 0 0 0 2px var(--rose)}
.cal-g button.sel{background:var(--rose);color:var(--chiffon);font-weight:700}
.cal-g u{position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--rose)}.sel u{background:var(--chiffon)}
.tl{display:grid;gap:10px;margin-top:6px}
.tl>div{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start}
.tl time{font-size:12.5px;font-weight:700;color:var(--muted);padding-top:12px}
.tl p{margin:0;padding:10px 14px;border-radius:16px;background:var(--blue);font-weight:600;font-size:14px}
.tl p.t{background:var(--chiffon)}.tl small{display:block;font-weight:400;color:var(--muted)}

/* Botões, formulários, janelas */
label.f{display:block;font-size:13.5px;font-weight:600;margin-top:12px}
label.f input,label.f select,label.f textarea,.filters select,.acts select,.mpick input,.bud input,.filters input{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:400}
.filters select,.acts select,.mpick input,.bud input,.filters input{width:auto}
label.f textarea{resize:vertical}
.btn{border:0;background:var(--rose);color:var(--chiffon);padding:10px 20px;border-radius:999px;cursor:pointer;font-weight:600;transition:transform .1s,background .15s}
.btn:hover{background:var(--bean)}.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--rose);box-shadow:inset 0 0 0 1px var(--line)}.btn.ghost:hover{background:var(--soft)}
dialog{border:0;border-radius:26px;padding:26px;width:min(440px,92vw);background:#fff;color:var(--bean);box-shadow:0 24px 70px rgba(45,18,13,.3)}
dialog[open]{animation:pop .2s ease}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
dialog::backdrop{background:rgba(45,18,13,.45)}dialog h2{font-size:22px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.soon{background:var(--blue);border-color:transparent}.soon ul{margin:0;padding-left:20px}

/* Tarefas */
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button,.chips button{border:0;background:transparent;padding:7px 14px;cursor:pointer;border-radius:999px;font-weight:500}
.seg .on{background:var(--bean);color:var(--chiffon);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chips button{border:1px solid var(--line);white-space:nowrap;background:#fff}
.chips button.on{background:var(--rose);color:var(--chiffon);border-color:var(--rose)}.chips small{opacity:.7}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.filters select,.filters input{width:100%}
.tasks{display:grid;gap:12px}.tasks.cards{grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.task{padding:16px 18px}.task.late{border-left:5px solid var(--rose)}
.t-main{display:flex;gap:12px;align-items:flex-start}.t-main p{margin:2px 0 0}
.t-main input,.sub input{accent-color:var(--rose);width:20px;height:20px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0 32px}
.tag{font-size:12px;font-weight:600;padding:3px 11px;border-radius:999px;background:var(--blue);color:var(--bean)}
.tag.p-baixa{background:var(--chiffon)}.tag.p-alta{background:#fff;box-shadow:inset 0 0 0 1px var(--rose);color:var(--rose)}
.tag.p-urgente{background:var(--rose);color:var(--chiffon)}
.sub{display:flex;gap:10px;align-items:center;margin:6px 0 0 32px;font-size:14px}
.acts{display:flex;gap:6px;margin:12px 0 0 32px;flex-wrap:wrap;align-items:center}
.acts .btn{padding:6px 14px}.hist{margin-top:12px;font-size:13px}.hist ul{padding-left:18px;margin:6px 0}

/* Financeiro */
.grow{flex:1;min-width:0}.grow small{display:block;color:var(--muted);font-size:12.5px}
.btn.sm{padding:5px 13px;font-size:13px;background:var(--rose)}.btn.sm.ghost{background:transparent}
.mpick{display:inline-flex;gap:6px;align-items:center}
.mpick button{border:0;background:#fff;box-shadow:inset 0 0 0 1px var(--line);border-radius:50%;width:38px;height:38px;cursor:pointer;color:var(--rose);font-size:20px;line-height:1}
.sr{font-size:0}.sr input{font-size:15px;width:100%}.filters label.f{margin:0}
.chart{width:100%;height:auto}.legend{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.legend i,.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 8px}.dot{margin:0 8px 0 0}
.bar{flex:1;height:9px;background:rgba(45,18,13,.1);border-radius:99px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--rose);border-radius:99px;transition:width .6s ease}
.bar.big{height:12px;flex:none;margin:10px 0 4px}.bar.full{flex-basis:100%}
details.inv{border-bottom:1px solid var(--line);padding:8px 0}
details.inv summary{cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
details.inv summary .meta{margin-left:auto}
textarea{font:inherit}

/* Celular */
#tabs,#sheet{display:none}
@media (max-width:1180px){.dash{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
  #side{display:none}
  #main{margin:0;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 120px}
  .g2{grid-template-columns:1fr}.top{margin-bottom:18px}.ib.hide-m{display:none}
  #tabs{display:flex;position:fixed;inset:auto 12px calc(10px + env(safe-area-inset-bottom,0px)) 12px;background:var(--bean);border-radius:24px;padding:6px;z-index:5;box-shadow:0 10px 30px rgba(45,18,13,.3)}
  #tabs a,#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font-size:11px;color:color-mix(in srgb,var(--chiffon) 70%,transparent);text-decoration:none;background:none;border:0;cursor:pointer;border-radius:18px;font-weight:500}
  #tabs .on{background:var(--rose);color:var(--chiffon)}
  #sheet:not([hidden]){display:block;position:fixed;inset:0;z-index:10;background:rgba(45,18,13,.45)}
  #sheet .panel{position:absolute;inset:auto 0 0 0;max-height:82%;overflow:auto;background:var(--bean);border-radius:26px 26px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px))}
  #sheet a{color:var(--chiffon)}#sheet a.on{background:var(--rose)}
  .tags,.sub,.acts{margin-left:0}.money b{font-size:15px}.two{grid-template-columns:1fr}
}

/* Cards Rosewood */
.c-rose h2,.c-rose .meta,.c-rose .empty{color:var(--chiffon)}
.c-rose .ci{background:rgba(255,255,255,.16);color:var(--chiffon)}
.c-rose .list li{background:rgba(255,255,255,.12)}
.c-rose .empty{border-color:rgba(255,255,255,.3)}
.c-rose .list input[type=checkbox]{border-color:var(--chiffon);background:transparent}
.c-rose .list input[type=checkbox]:checked{background:var(--chiffon)}
.c-rose .list input[type=checkbox]:checked::after{border-color:var(--rose)}
.c-rose::after{background:rgba(255,255,255,.08)}
.c-rose .notes{background:rgba(255,255,255,.14);color:var(--chiffon)}
.c-rose .notes::placeholder{color:rgba(255,255,255,.6)}

/* Ideias e inspirações */
.mural{column-width:220px;column-gap:16px}
.mural .ref{break-inside:avoid;margin-bottom:16px}
.ref{padding:0}.ref .rb,.card .rb{padding:12px 14px;display:grid;gap:6px}
.ref img,.card .big-img{display:block;width:100%;height:auto;background:var(--blue)}
.card .big-img{max-height:70vh;object-fit:contain}
.ph{height:120px;background:var(--blue)}
.imgb{display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;overflow:hidden;border-radius:22px 22px 0 0}
.imgb img{transition:transform .3s}.imgb:hover img{transform:scale(1.03)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.thumbs .imgb{border-radius:14px;aspect-ratio:1}.thumbs img,.thumbs .ph{height:100%;width:100%;object-fit:cover;aspect-ratio:1!important}
.btn.ghost.on{background:var(--bean);color:var(--chiffon)}

/* Galeria, lightbox e Minhas compras */
.gal{column-width:170px;column-gap:12px;padding:14px}
.gal figure{margin:0 0 12px;break-inside:avoid;border-radius:16px;overflow:hidden;background:var(--bg)}
.gal figcaption{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px}
.gal .imgb{border-radius:0}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.prod{padding:0}.prod .rb{gap:5px}
.price{font-size:20px;font-weight:800;letter-spacing:-.02em}
.imgb.sq,.ph.sq{aspect-ratio:1;height:auto}.imgb.sq img{height:100%;object-fit:cover;aspect-ratio:1!important}
.ph.sq{display:grid;place-items:center}

<body>
<aside id="side"></aside>
<main id="main"></main>
<nav id="tabs"></nav>
<div id="sheet" hidden></div>
<dialog id="dlg"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script>
/* ARMAZENAMENTO — único lugar que sabe onde os dados ficam.
   Hoje: no navegador (localStorage). Depois: trocar só este arquivo por um
   banco de dados na nuvem + login, sem mexer no resto do site.
   Coleções: tasks, events, habits, transactions, projects, settings. */
const Store = {
  _k: n => 'planner:' + n,
  get(name, fallback) {
    try { const v = localStorage.getItem(this._k(name)); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  },
  set(name, value) {
    try { localStorage.setItem(this._k(name), JSON.stringify(value)); } catch (e) {}
  },
  list(col) { return this.get(col, []); },
  add(col, item) {
    const all = this.list(col);
    item.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    all.push(item); this.set(col, all); return item;
  },
  update(col, id, changes) {
    this.set(col, this.list(col).map(i => i.id === id ? { ...i, ...changes } : i));
  },
  today() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }
};

/* ARQUIVOS (anexos) — IndexedDB do navegador: guarda o arquivo de verdade (Blob), sem o limite de ~5 MB do localStorage.
   Também fica só neste arquivo: para ir à nuvem depois, troque apenas estas 3 funções. */
const Files = {
  _db: null,
  open() {
    return this._db || (this._db = new Promise((res, rej) => {
      const r = indexedDB.open('planner-files', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('f');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    }));
  },
  async _tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('f', mode), q = fn(t.objectStore('f'));
      t.oncomplete = () => res(q && q.result); t.onerror = t.onabort = () => rej(t.error);
    });
  },
  put(id, blob) { return this._tx('readwrite', s => s.put(blob, id)); },
  get(id) { return this._tx('readonly', s => s.get(id)); },
  del(id) { return this._tx('readwrite', s => s.delete(id)); },
  entries() {   // todos os anexos [[id, Blob/File], ...] — usado pelo backup
    return this.open().then(db => new Promise((res, rej) => {
      const out = [], t = db.transaction('f'), q = t.objectStore('f').openCursor();
      q.onsuccess = () => { const c = q.result; if (c) { out.push([c.key, c.value]); c.continue(); } };
      t.oncomplete = () => res(out); t.onerror = t.onabort = () => rej(t.error);
    }));
  }
};

</script>
<script>
/* TAREFAS — única fonte de dados das tarefas (coleção "tasks").
   Início, Projetos e Tarefas leem e alteram as mesmas tarefas. */
const Tasks = {
  S: { view: 'todas', cat: '', pri: '', st: '', per: '', mode: (Store.get('settings', {}).taskMode || 'lista') },
  CATS: ['Pessoal','Trabalho','Faculdade','Financeiro','Saúde','Espiritual','Casa','Outros'],
  PRI: ['baixa','média','alta','urgente'],
  STS: ['não iniciada','em andamento','aguardando','concluída'],
  REC: ['não se repete','diariamente','semanalmente','mensalmente','personalizada'],
  VIEWS: [['todas','Todas'],['hoje','Para hoje'],['proximas','Próximas'],['atrasadas','Atrasadas'],['semdata','Sem data'],['concluidas','Concluídas']],
  LABEL: { title:'Nome', start:'Início', due:'Vencimento', time:'Horário', cat:'Categoria', priority:'Prioridade', status:'Status', recur:'Recorrência', desc:'Observações', projectId:'Projeto' },

  all() { return Store.list('tasks'); },
  open() { return this.all().filter(t => t.status !== 'concluída'); },
  uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); },
  log(t, text) { t.history.push({ at: new Date().toISOString(), text }); },

  /* Converte tarefas antigas (feitas na etapa 1) para o formato completo, sem perder nada */
  normalize() {
    const a = this.all();
    a.forEach(t => {
      t.status = t.status || (t.done ? 'concluída' : 'não iniciada'); delete t.done;
      t.priority = t.priority || 'média'; t.cat = t.cat || 'Pessoal'; t.recur = t.recur || 'não se repete';
      t.subtasks = t.subtasks || []; t.history = t.history || [];
      if (!t.history.length) this.log(t, 'Criada');
    });
    Store.set('tasks', a);
  },

  /* Datas */
  fmt(x) { const p = n => String(n).padStart(2, '0'); return `${x.getFullYear()}-${p(x.getMonth() + 1)}-${p(x.getDate())}`; },
  addDays(s, n) { const [y, m, d] = s.split('-').map(Number); return this.fmt(new Date(y, m - 1, d + n)); },
  addMonth(s) { const [y, m, d] = s.split('-').map(Number); return this.fmt(new Date(y, m, Math.min(d, new Date(y, m + 1, 0).getDate()))); },
  step(t, s) {
    return t.recur === 'diariamente' ? this.addDays(s, 1) : t.recur === 'semanalmente' ? this.addDays(s, 7)
      : t.recur === 'mensalmente' ? this.addMonth(s) : this.addDays(s, Math.max(1, t.every || 1));
  },

  /* Concluir: tarefa que se repete volta com a próxima data; as demais ficam no histórico de concluídas */
  complete(id) {
    const a = this.all(), t = a.find(x => x.id === id); if (!t) return;
    const hoje = Store.today();
    if (t.recur !== 'não se repete') {
      const d0 = t.due || hoje; let n = this.step(t, d0); while (n <= hoje) n = this.step(t, n);
      const diff = Math.round((new Date(n) - new Date(d0)) / 864e5);
      if (t.start) t.start = this.addDays(t.start, diff);
      this.log(t, `Concluída em ${dm(hoje)}; próxima em ${dm(n)}`);
      t.due = n; t.status = 'não iniciada'; t.subtasks.forEach(s => s.done = false);
    } else { t.status = 'concluída'; t.doneAt = hoje; this.log(t, 'Concluída'); }
    Store.set('tasks', a);
  },
  reopen(id) {
    const a = this.all(), t = a.find(x => x.id === id);
    if (t) { t.status = 'não iniciada'; this.log(t, 'Reaberta'); Store.set('tasks', a); }
  },

  /* Filtros */
  inView(t, v) {
    const h = Store.today(), op = t.status !== 'concluída';
    return v === 'todas' || (v === 'hoje' && op && t.due === h) || (v === 'proximas' && op && t.due > h)
      || (v === 'atrasadas' && op && t.due && t.due < h) || (v === 'semdata' && op && !t.due) || (v === 'concluidas' && !op);
  },
  filtered() {
    const S = this.S, h = Store.today(), w = this.addDays(h, 7), m = h.slice(0, 7);
    return this.all().filter(t => this.inView(t, S.view) && (!S.cat || t.cat === S.cat) && (!S.pri || t.priority === S.pri) && (!S.st || t.status === S.st)
      && (!S.per || (S.per === 'hoje' && t.due === h) || (S.per === 'semana' && t.due >= h && t.due <= w) || (S.per === 'mes' && (t.due || '').startsWith(m))))
      .sort((a, b) => ((a.status === 'concluída') - (b.status === 'concluída')) || (a.due || '9').localeCompare(b.due || '9')
        || (a.time || '').localeCompare(b.time || '') || this.PRI.indexOf(b.priority) - this.PRI.indexOf(a.priority));
  },

  /* Telas */
  proj(t) { return (Store.list('projects').find(p => p.id === t.projectId) || {}).title; },
  item(t) {
    const h = Store.today(), done = t.status === 'concluída', late = !done && t.due && t.due < h, pj = this.proj(t);
    const subs = t.subtasks.map(s => `<label class="sub"><input type="checkbox" data-sub="${t.id}|${s.id}" ${s.done ? 'checked' : ''}><span class="${s.done ? 'done' : ''}">${esc(s.t)}</span></label>`).join('');
    const when = t.due ? `${dm(t.due)}${t.time ? ' às ' + esc(t.time) : ''}` : 'sem data';
    return `<article class="card task ${late ? 'late' : ''}">
      <div class="t-main"><input type="checkbox" data-t-done="${t.id}" ${done ? 'checked' : ''} aria-label="Concluir"><div><b class="${done ? 'done' : ''}">${esc(t.title)}</b>${t.desc ? `<p class="empty">${esc(t.desc)}</p>` : ''}</div></div>
      <div class="tags"><span class="tag p-${t.priority}">${t.priority}</span><span class="tag">${esc(t.cat)}</span><span class="tag">${t.status}</span>${pj ? `<span class="tag">${esc(pj)}</span>` : ''}${t.recur !== 'não se repete' ? `<span class="tag">${t.recur}</span>` : ''}<span class="tag ${late ? 'p-urgente' : ''}">${late ? 'atrasada · ' : ''}${when}</span></div>
      ${subs}
      <div class="acts"><select data-t-pri="${t.id}" aria-label="Prioridade">${this.PRI.map(p => `<option ${p === t.priority ? 'selected' : ''}>${p}</option>`).join('')}</select><button class="btn ghost" data-t-edit="${t.id}">Editar</button><button class="btn ghost" data-t-del="${t.id}">Excluir</button></div></article>`;
  },
  page(p) {
    const S = this.S, list = this.filtered();
    const sel = (k, label, opts) => `<select data-t-f="${k}" aria-label="${label}"><option value="">${label}</option>${opts.map(o => { o = Array.isArray(o) ? o : [o, o]; return `<option value="${o[0]}" ${S[k] === o[0] ? 'selected' : ''}>${o[1]}</option>`; }).join('')}</select>`;
    return `<header class="page-head"><h1>${p[1]}</h1><p>${p[3]}</p></header>
    <div class="toolbar"><button class="btn" data-t-new>+ Nova tarefa</button><span class="seg"><button data-t-mode="lista" class="${S.mode === 'lista' ? 'on' : ''}">Lista</button><button data-t-mode="cards" class="${S.mode === 'cards' ? 'on' : ''}">Cards</button></span></div>
    <div class="chips">${this.VIEWS.map(([k, l]) => `<button data-t-view="${k}" class="${S.view === k ? 'on' : ''}">${l} <small>${this.all().filter(t => this.inView(t, k)).length}</small></button>`).join('')}</div>
    <div class="filters">${sel('cat', 'Categoria', this.CATS)}${sel('pri', 'Prioridade', this.PRI)}${sel('st', 'Status', this.STS)}${sel('per', 'Período', [['hoje', 'Hoje'], ['semana', 'Próximos 7 dias'], ['mes', 'Este mês']])}</div>
    <div class="tasks ${S.mode}">${list.length ? list.map(t => this.item(t)).join('') : card('Nada por aqui', empty('Nenhuma tarefa neste filtro.'))}</div>`;
  },
  projects(p) {
    const ps = Store.list('projects');
    const body = ps.length ? ps.map(pr => {
      const ts = this.all().filter(t => t.projectId === pr.id);
      return card(esc(pr.title), ts.length ? `<ul class="list">${ts.map(t => `<li><input type="checkbox" data-t-done="${t.id}" ${t.status === 'concluída' ? 'checked' : ''}><span class="${t.status === 'concluída' ? 'done' : ''}">${esc(t.title)}</span><span class="meta">${dm(t.due)}</span></li>`).join('')}</ul>` : empty('Sem tarefas neste projeto.'));
    }).join('') : card('Nenhum projeto ainda', empty('Informe o nome de um projeto ao criar uma tarefa e ele aparecerá aqui. O cadastro completo de projetos vem em outra etapa.'), 'soon');
    return `<header class="page-head"><h1>${p[1]}</h1><p>${p[3]}</p></header><div class="grid">${body}</div>`;
  },

  /* Formulário de criar/editar */
  form(id) {
    const dlg = $('#dlg'), old = id ? this.all().find(x => x.id === id) : null;
    const t = old || { status: 'não iniciada', priority: 'média', recur: 'não se repete', cat: 'Pessoal', subtasks: [], history: [] };
    const o = (arr, v) => arr.map(x => `<option ${x === v ? 'selected' : ''}>${x}</option>`).join('');
    const f = (n, l, type, v = '', x = '') => `<label class="f">${l}<input name="${n}" type="${type}" value="${esc(v)}" ${x}></label>`;
    const pn = this.proj(t) || '';
    dlg.innerHTML = `<form method="dialog" id="tfrm"><h2>${old ? 'Editar tarefa' : 'Nova tarefa'}</h2>
      ${f('title', 'Nome da tarefa', 'text', t.title, 'required')}
      <label class="f">Descrição ou observações<textarea name="desc" rows="2">${esc(t.desc)}</textarea></label>
      <div class="two">${f('start', 'Início (opcional)', 'date', t.start)}${f('due', 'Vencimento', 'date', t.due)}</div>
      ${f('time', 'Horário (opcional)', 'time', t.time)}
      <div class="two"><label class="f">Categoria<select name="cat">${o(this.CATS, t.cat)}</select></label><label class="f">Prioridade<select name="priority">${o(this.PRI, t.priority)}</select></label></div>
      <div class="two"><label class="f">Status<select name="status">${o(this.STS, t.status)}</select></label><label class="f">Recorrência<select name="recur">${o(this.REC, t.recur)}</select></label></div>
      ${f('every', 'Se personalizada: repetir a cada quantos dias?', 'number', t.every || 2, 'min="1"')}
      <label class="f">Projeto relacionado (opcional)<input name="project" list="plist" value="${esc(pn)}"><datalist id="plist">${Store.list('projects').map(p => `<option value="${esc(p.title)}">`).join('')}</datalist></label>
      <label class="f">Subtarefas (uma por linha)<textarea name="subs" rows="3">${t.subtasks.map(s => esc(s.t)).join('\n')}</textarea></label>
      ${old ? `<details class="hist"><summary>Histórico (${t.history.length})</summary><ul>${[...t.history].reverse().map(h => `<li>${new Date(h.at).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })} — ${esc(h.text)}</li>`).join('')}</ul></details>` : ''}
      <p class="empty" id="terr"></p>
      <div class="row"><button type="button" class="btn ghost" id="cancel">Cancelar</button><button class="btn">Salvar</button></div></form>`;
    dlg.showModal();
    $('#cancel').onclick = () => dlg.close();
    $('#tfrm').onsubmit = e => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(e.target)), a = this.all(), title = d.title.trim();
      if (!title) return;
      if (a.some(x => x.id !== id && x.status !== 'concluída' && x.title.trim().toLowerCase() === title.toLowerCase() && (x.due || '') === d.due)) {
        $('#terr').textContent = 'Já existe uma tarefa em aberto com este nome e esta data.'; return;
      }
      let pid = ''; const pt = d.project.trim();
      if (pt) { const pr = Store.list('projects').find(x => x.title.toLowerCase() === pt.toLowerCase()) || Store.add('projects', { title: pt, status: 'andamento' }); pid = pr.id; }
      const subs = d.subs.split('\n').map(s => s.trim()).filter(Boolean).map(s => (t.subtasks.find(x => x.t === s)) || { id: this.uid(), t: s, done: false });
      const nt = { ...t, title, desc: d.desc, start: d.start, due: d.due, time: d.time, cat: d.cat, priority: d.priority, status: d.status, recur: d.recur, every: +d.every || 1, projectId: pid, subtasks: subs };
      if (nt.status === 'concluída' && !old?.doneAt) nt.doneAt = Store.today();
      if (old) {
        Object.keys(this.LABEL).forEach(k => {
          if ((old[k] || '') === (nt[k] || '')) return;
          this.log(nt, k === 'desc' ? 'Observações atualizadas' : k === 'projectId' ? 'Projeto atualizado' : `${this.LABEL[k]}: ${old[k] || '—'} → ${nt[k] || '—'}`);
        });
        Store.set('tasks', a.map(x => x.id === id ? nt : x));
      } else { nt.id = this.uid(); nt.history = []; this.log(nt, 'Criada'); a.push(nt); Store.set('tasks', a); }
      dlg.close(); render();
    };
  },
  del(id) {
    const dlg = $('#dlg'), t = this.all().find(x => x.id === id);
    dlg.innerHTML = `<h2>Excluir tarefa?</h2><p>“${esc(t.title)}” será removida de todas as páginas. Se quiser manter o registro, marque como concluída.</p><div class="row"><button class="btn ghost" id="no">Cancelar</button><button class="btn" id="yes">Excluir</button></div>`;
    dlg.showModal();
    $('#no').onclick = () => dlg.close();
    $('#yes').onclick = () => { Store.set('tasks', this.all().filter(x => x.id !== id)); dlg.close(); render(); };
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-t-view],[data-t-mode],[data-t-new],[data-t-edit],[data-t-del]'); if (!b) return;
  const d = b.dataset;
  if (d.tView) { Tasks.S.view = d.tView; render(); }
  else if (d.tMode) { Tasks.S.mode = d.tMode; Store.set('settings', { ...Store.get('settings', {}), taskMode: d.tMode }); render(); }
  else if ('tNew' in d) Tasks.form();
  else if (d.tEdit) Tasks.form(d.tEdit);
  else if (d.tDel) Tasks.del(d.tDel);
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (d.tF) { Tasks.S[d.tF] = t.value; render(); }
  else if (d.tDone) { t.checked ? Tasks.complete(d.tDone) : Tasks.reopen(d.tDone); render(); }
  else if (d.tPri) {
    const a = Tasks.all(), k = a.find(x => x.id === d.tPri);
    Tasks.log(k, `Prioridade: ${k.priority} → ${t.value}`); k.priority = t.value; Store.set('tasks', a); render();
  } else if (d.sub) {
    const [tid, sid] = d.sub.split('|'), a = Tasks.all(), k = a.find(x => x.id === tid), s = k.subtasks.find(x => x.id === sid);
    s.done = t.checked; Tasks.log(k, `Subtarefa “${s.t}” ${s.done ? 'concluída' : 'reaberta'}`); Store.set('tasks', a); render();
  }
});

</script>
<script>
/* FINANCEIRO — todos os valores são calculados a partir de poucos registros únicos:
   transactions (receitas e despesas), cards, payments (pagamentos de fatura), bills (contas fixas), budgets.
   Parcelas e faturas NÃO são gravadas: são calculadas a partir da compra, então nunca duplicam. */
const Fin = {
  S: { tab: 'geral', ym: Store.today().slice(0, 7), q: '', cat: '', st: '', per: 'mes', card: '' },
  INC: ['Salário','Projetos e trabalhos','Recebimentos de clientes','Transferências','Outros'],
  EXP: ['Alimentação','Mercado','Beleza','Saúde','Transporte','Estudos','Compras','Lazer','Casa','Assinaturas','Viagens','Outros'],
  PAY: ['Cartão de crédito','Pix','Débito','Dinheiro','Boleto','Outro'],
  CARD: 'Cartão de crédito',
  TABS: [['geral','Visão geral'],['receitas','Receitas'],['despesas','Despesas'],['cartoes','Cartões'],['faturas','Faturas'],['fixas','Contas fixas'],['plano','Planejamento'],['rel','Relatórios']],
  R: x => Math.round(x * 100) / 100,
  sum(a, f) { return this.R(a.reduce((s, x) => s + f(x), 0)); },
  tx() { return Store.list('transactions'); },
  cards() { return Store.list('cards'); },
  bills() { return Store.list('bills'); },
  cd(id) { return this.cards().find(c => c.id === id); },
  put(col, o, id) {
    const a = Store.list(col);
    if (id) Store.set(col, a.map(x => x.id === id ? { ...x, ...o } : x)); else { o.id = Tasks.uid(); a.push(o); Store.set(col, a); }
  },
  rm(col, id) { Store.set(col, Store.list(col).filter(x => x.id !== id)); },

  /* Datas */
  ymOf(d) { return (d || '').slice(0, 7); },
  addM(ym, n) { const [y, m] = ym.split('-').map(Number), x = new Date(y, m - 1 + n, 1); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0'); },
  mname(ym) { const [y, m] = ym.split('-'); return new Date(y, m - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }); },
  dateIn(ym, day) { const [y, m] = ym.split('-').map(Number); return ym + '-' + String(Math.min(day, new Date(y, m, 0).getDate())).padStart(2, '0'); },

  /* Migração: preserva lançamentos antigos e cadastra os 4 cartões (sem limites inventados) */
  normalize() {
    const T = this.tx();
    T.forEach(t => {
      t.amount = +t.amount || 0; t.cat = t.cat || 'Outros'; t.method = t.method || 'Outro'; t.account = t.account || '';
      t.status = t.status || (t.type === 'receita' ? 'recebido' : t.paid === false ? 'pendente' : 'pago'); delete t.paid;
    });
    Store.set('transactions', T);
    if (Store.get('cards', null) === null) Store.set('cards', [['Riachuelo', '#6B0B0C'], ['C&A', '#2D120D'], ['Nubank', '#8a4b4c'], ['PicPay', '#7fb0bb']]
      .map(([n, c]) => ({ id: Tasks.uid(), name: n, inst: n, limit: 0, closing: 0, due: 0, color: c })));
  },

  /* Parcelas e faturas (calculadas) */
  first(t) {
    if (t.firstInv) return t.firstInv;
    const c = this.cd(t.cardId), cl = (c && c.closing) || 31;
    return +t.date.slice(8) > cl ? this.addM(this.ymOf(t.date), 1) : this.ymOf(t.date);
  },
  parcels(t) {
    const n = Math.max(1, t.inst || 1), cents = Math.round(t.amount * 100), b = Math.floor(cents / n), f = this.first(t);
    return Array.from({ length: n }, (_, i) => ({ t, i: i + 1, n, ym: this.addM(f, i), amount: (b + (i === n - 1 ? cents - b * n : 0)) / 100 }));
  },
  allParcels(cid) { return this.tx().filter(t => t.type === 'despesa' && t.method === this.CARD && t.cardId && (!cid || t.cardId === cid)).flatMap(t => this.parcels(t)); },
  invoice(cid, ym) {
    const c = this.cd(cid), items = this.allParcels(cid).filter(p => p.ym === ym), pays = Store.list('payments').filter(p => p.cardId === cid && p.month === ym);
    const total = this.sum(items, p => p.amount), paid = this.sum(pays, p => p.amount), rest = Math.max(0, this.R(total - paid));
    const close = c.closing ? this.dateIn(ym, c.closing) : null, dueYm = c.closing && c.due && c.due <= c.closing ? this.addM(ym, 1) : ym;
    const due = c.due ? this.dateIn(dueYm, c.due) : null;
    const status = total > 0 && rest < 0.005 ? 'paga' : paid > 0 ? 'paga parcialmente' : (close && Store.today() > close) ? 'fechada' : 'aberta';
    return { cardId: cid, ym, items, pays, total, paid, rest, close, due, status };
  },
  invMonths(cid) { return [...new Set([...this.allParcels(cid).map(p => p.ym), ...Store.list('payments').filter(p => p.cardId === cid).map(p => p.month)])].sort(); },
  invoices(cid) { return this.invMonths(cid).map(m => this.invoice(cid, m)); },
  used(cid) { return this.sum(this.invoices(cid), v => v.rest); },
  curInv(c) { const t = Store.today(); return this.invoice(c.id, +t.slice(8) > (c.closing || 31) ? this.addM(t.slice(0, 7), 1) : t.slice(0, 7)); },

  /* Totais. Receitas: só "recebido", sem transferências. Despesas do mês: à vista (por data) + parcelas cuja fatura é do mês.
     Pagamento de fatura NÃO entra como despesa; só reduz o saldo. */
  summary(ym) {
    const T = this.tx(), inM = t => this.ymOf(t.date) === ym;
    const rec = this.sum(T.filter(t => t.type === 'receita' && t.status === 'recebido' && t.cat !== 'Transferências' && inM(t)), t => t.amount);
    const prevRec = this.sum(T.filter(t => t.type === 'receita' && t.status === 'previsto' && t.cat !== 'Transferências' && inM(t)), t => t.amount);
    const items = [...T.filter(t => t.type === 'despesa' && t.method !== this.CARD && inM(t)).map(t => ({ cat: t.cat, amount: t.amount })),
      ...this.allParcels().filter(p => p.ym === ym).map(p => ({ cat: p.t.cat, amount: p.amount }))];
    const byCat = {}; items.forEach(i => byCat[i.cat] = this.R((byCat[i.cat] || 0) + i.amount));
    const des = this.sum(items, i => i.amount);
    return { rec, prevRec, des, saved: this.R(rec - des), byCat };
  },
  saldo() {
    const T = this.tx();
    return this.R((+Store.get('settings', {}).saldoInicial || 0)
      + this.sum(T.filter(t => t.type === 'receita' && t.status === 'recebido' && t.cat !== 'Transferências'), t => t.amount)
      - this.sum(T.filter(t => t.type === 'despesa' && t.method !== this.CARD && t.status === 'pago'), t => t.amount)
      - this.sum(Store.list('payments'), p => p.amount));
  },

  /* Contas fixas */
  stepBill(b, d) {
    return b.freq === 'semanal' ? Tasks.addDays(d, 7) : b.freq === 'mensal' ? this.dateIn(this.addM(d.slice(0, 7), 1), b.day || +d.slice(8))
      : b.freq === 'anual' ? this.dateIn(this.addM(d.slice(0, 7), 12), b.day || +d.slice(8)) : Tasks.addDays(d, Math.max(1, b.every || 1));
  },
  occ(b, ym) {
    if (b.status === 'pago') return [];
    const out = []; let d = b.due, n = 0;
    while (this.ymOf(d) <= ym && n++ < 400) { if (this.ymOf(d) === ym) out.push(d); if (b.freq === 'única') break; d = this.stepBill(b, d); }
    return out;
  },
  payBill(id) {
    const b = this.bills().find(x => x.id === id); if (!b) return;
    this.put('transactions', { type: 'despesa', desc: b.name, amount: b.amount, date: Store.today(), cat: b.cat, method: b.method, account: '', status: 'pago', billId: id, notes: 'Vencimento ' + dm(b.due) });
    this.put('bills', b.freq === 'única' ? { status: 'pago' } : { due: this.stepBill(b, b.due) }, id);
  },
  upcoming(days) {
    const T = Store.today(), lim = Tasks.addDays(T, days), o = [];
    this.bills().filter(b => b.status !== 'pago' && b.due <= lim).forEach(b => o.push({ desc: b.name, amount: b.amount, due: b.due }));
    this.cards().forEach(c => this.invoices(c.id).forEach(v => { if (v.rest > 0 && v.due && v.due <= lim) o.push({ desc: 'Fatura ' + c.name, amount: v.rest, due: v.due }); }));
    this.tx().filter(t => t.type === 'despesa' && t.method !== this.CARD && t.status === 'pendente' && (t.due || t.date) <= lim).forEach(t => o.push({ desc: t.desc, amount: t.amount, due: t.due || t.date }));
    return o.map(x => ({ ...x, late: x.due < T })).sort((a, b) => a.due.localeCompare(b.due));
  },

  /* Componentes */
  acts(k, id) { return `<button class="btn ghost sm" data-f="edit:${k}:${id}">Editar</button><button class="btn ghost sm" data-f="del:${k}:${id}">Excluir</button>`; },
  chart(months) {
    const data = months.map(m => { const s = this.summary(m); return [m, s.rec, s.des]; }), mx = Math.max(1, ...data.flatMap(d => [d[1], d[2]])), w = 360 / data.length;
    return `<svg viewBox="0 0 360 165" class="chart" role="img" aria-label="Receitas e despesas por mês">` + data.map((d, i) => {
      const x = i * w + w * .12, bw = w * .34, h1 = d[1] / mx * 120, h2 = d[2] / mx * 120;
      return `<rect x="${x}" y="${130 - h1}" width="${bw}" height="${h1}" fill="#CDE3E8" rx="2"><title>Receitas ${brl(d[1])}</title></rect><rect x="${x + bw + 2}" y="${130 - h2}" width="${bw}" height="${h2}" fill="#6B0B0C" rx="2"><title>Despesas ${brl(d[2])}</title></rect><text x="${i * w + w / 2}" y="150" text-anchor="middle" font-size="11" fill="#2D120D">${this.mname(d[0]).slice(0, 3)}</text>`;
    }).join('') + `</svg><p class="legend"><i style="background:#CDE3E8"></i>Receitas <i style="background:#6B0B0C"></i>Despesas</p>`;
  },
  catBars(by) {
    const e = Object.entries(by).sort((a, b) => b[1] - a[1]), mx = e.length ? e[0][1] : 1;
    return e.length ? `<ul class="list">${e.map(([c, v]) => `<li><span>${esc(c)}</span><div class="bar"><i style="width:${v / mx * 100}%"></i></div><span class="meta">${brl(v)}</span></li>`).join('')}</ul>` : empty('Sem despesas neste mês.');
  },
  diff(a, b) { return b ? `${a >= b ? '+' : ''}${Math.round((a - b) / Math.abs(b) * 100)}%` : '—'; },
  cmp(ym) {
    const s = this.summary(ym), p = this.summary(this.addM(ym, -1));
    return ul([['Receitas', s.rec, p.rec], ['Despesas', s.des, p.des], ['Economia', s.saved, p.saved]].map(([l, a, b]) => `<li><span>${l}</span><span class="meta">${brl(a)} (mês anterior ${brl(b)}) · ${this.diff(a, b)}</span></li>`));
  },
  sel(k, label, opts) { return `<select data-f-flt="${k}" aria-label="${label}"><option value="">${label}</option>${opts.map(o => { o = Array.isArray(o) ? o : [o, o]; return `<option value="${o[0]}" ${this.S[k] === o[0] ? 'selected' : ''}>${o[1]}</option>`; }).join('')}</select>`; },
  txRow(t) {
    const isC = t.method === this.CARD, c = this.cd(t.cardId), n = isC && t.inst > 1 ? ` · ${t.inst}x de ${brl(this.parcels(t)[0].amount)}` : '';
    return `<li><div class="grow"><b>${esc(t.desc)}</b><small>${dm(t.date)} · ${esc(t.cat)} · ${esc(isC && c ? c.name : t.account || t.method)}${n} · ${isC ? 'na fatura' : t.status}${t.type === 'receita' && t.recur && t.recur !== 'não se repete' ? ' · ' + t.recur : ''}</small>${t.notes ? `<small>${esc(t.notes)}</small>` : ''}</div><span class="meta">${brl(t.amount)}</span>${this.acts(t.type, t.id)}</li>`;
  },
  txList(type) {
    const S = this.S, q = S.q.toLowerCase(), isR = type === 'receita';
    const a = this.tx().filter(t => t.type === type && (S.per !== 'mes' || this.ymOf(t.date) === S.ym) && (!q || (t.desc + ' ' + (t.notes || '')).toLowerCase().includes(q)) && (!S.cat || t.cat === S.cat) && (!S.st || t.status === S.st))
      .sort((x, y) => y.date.localeCompare(x.date));
    return `<div class="toolbar"><button class="btn" data-f="new:${type}">+ ${isR ? 'Nova receita' : 'Nova despesa'}</button></div>
    <div class="filters"><label class="f sr">Pesquisar<input type="search" placeholder="Pesquisar" data-f-flt="q" value="${esc(S.q)}"></label>${this.sel('cat', 'Categoria', isR ? this.INC : this.EXP)}${this.sel('st', 'Status', isR ? ['recebido', 'previsto'] : ['pago', 'pendente'])}${this.sel('per', 'Período', [['mes', 'Mês selecionado'], ['tudo', 'Todos os meses']])}</div>
    ${card(`${a.length} lançamento(s) · ${brl(this.sum(a, t => t.amount))}`, a.length ? `<ul class="list">${a.map(t => this.txRow(t)).join('')}</ul>` : empty('Nenhum lançamento neste filtro.'))}`;
  },

  /* Abas */
  page(p) {
    const S = this.S;
    return `<header class="page-head"><h1>${p[1]}</h1><p>${p[3]}</p></header>
    <div class="toolbar"><span class="mpick"><button data-f="m:-1" aria-label="Mês anterior">‹</button><input type="month" data-f-ym value="${S.ym}" aria-label="Mês de referência"><button data-f="m:1" aria-label="Próximo mês">›</button></span></div>
    <div class="chips">${this.TABS.map(([k, l]) => `<button data-f="tab:${k}" class="${S.tab === k ? 'on' : ''}">${l}</button>`).join('')}</div>${this[S.tab]()}`;
  },
  geral() {
    const ym = this.S.ym, s = this.summary(ym), k = (v, l) => `<div><b>${brl(v)}</b><span>${l}</span></div>`;
    const inv = f => this.sum(this.cards().flatMap(c => this.invoices(c.id).filter(f)), v => v.rest);
    const up = this.upcoming(30);
    const months = Array.from({ length: 6 }, (_, i) => this.addM(ym, i - 5));
    return `<div class="grid">
    ${card('Resumo de ' + this.mname(ym), `<div class="money">${k(this.saldo(), 'Saldo disponível')}${k(s.rec, 'Receitas')}${k(s.des, 'Despesas')}</div><div class="money" style="margin-top:8px">${k(s.saved, 'Economia do mês')}${k(inv(v => v.ym <= ym), 'Faturas em aberto')}${k(inv(v => v.ym > ym), 'Parcelas futuras')}</div>${s.prevRec ? `<p class="empty">Receitas previstas neste mês: ${brl(s.prevRec)}</p>` : ''}`)}
    ${card('Receitas x despesas', this.chart(months))}
    ${card('Despesas por categoria', this.catBars(s.byCat))}
    ${card('Comparação com o mês anterior', this.cmp(ym))}
    ${card('Próximos vencimentos (30 dias)', up.length ? ul(up.map(b => `<li><span>${esc(b.desc)}</span><span class="meta">${b.late ? 'atrasada · ' : ''}${brl(b.amount)} · ${dm(b.due)}</span></li>`)) : empty('Nada a vencer nos próximos 30 dias.'))}
    </div>`;
  },
  receitas() { return this.txList('receita'); },
  despesas() { return this.txList('despesa'); },
  cartoes() {
    const body = this.cards().map(c => {
      const used = this.used(c.id), lim = +c.limit || 0, cur = this.curInv(c), pct = lim ? Math.round(used / lim * 100) : 0;
      return `<section class="card" style="border-top:5px solid ${esc(c.color)}"><h2>${esc(c.name)}</h2><p class="empty">${esc(c.inst)} · fecha dia ${c.closing || '—'} · vence dia ${c.due || '—'}</p>
      <div class="money"><div><b>${brl(used)}</b><span>Utilizado</span></div><div><b>${lim ? brl(lim - used) : '—'}</b><span>Disponível</span></div><div><b>${lim ? brl(lim) : '—'}</b><span>Limite</span></div></div>
      ${lim ? `<div class="bar big"><i style="width:${Math.min(100, pct)}%;background:${esc(c.color)}"></i></div><p class="empty">${pct}% do limite utilizado</p>` : '<p class="empty">Limite não informado. Use Editar para preencher.</p>'}
      <p>Fatura atual (${this.mname(cur.ym)}): <b>${brl(cur.total)}</b> · ${cur.status}</p>
      <div class="acts" style="margin-left:0"><button class="btn ghost sm" data-f="cardinv:${c.id}">Ver faturas</button>${this.acts('cartao', c.id)}</div></section>`;
    }).join('');
    return `<div class="toolbar"><button class="btn" data-f="new:cartao">+ Novo cartão</button></div><div class="grid">${body || card('Sem cartões', empty('Cadastre um cartão.'))}</div>`;
  },
  invHtml(c, ym) {
    const v = this.invoice(c.id, ym);
    return `<details class="inv" ${ym === this.S.ym ? 'open' : ''}><summary><b>${this.mname(ym)}</b> <span class="tag">${v.status}</span><span class="meta">${brl(v.total)}</span></summary>
    <p class="empty">Fechamento: ${v.close ? dm(v.close) : '—'} · Vencimento: ${v.due ? dm(v.due) : '—'} · Pago ${brl(v.paid)} · Restante ${brl(v.rest)}</p>
    <ul class="list">${v.items.map(p => `<li><span>${esc(p.t.desc)}${p.n > 1 ? ` (${p.i}/${p.n})` : ''}</span><span class="meta">${dm(p.t.date)} · ${brl(p.amount)}</span></li>`).join('')}${v.pays.map(p => `<li><span>Pagamento da fatura</span><span class="meta">${dm(p.date)} · ${brl(p.amount)}</span><button class="btn ghost sm" data-f="delpay:${p.id}">Excluir</button></li>`).join('')}</ul>
    <button class="btn sm" data-f="pay:${c.id}:${ym}">Registrar pagamento</button></details>`;
  },
  faturas() {
    const S = this.S, cs = this.cards().filter(c => !S.card || c.id === S.card), now = Store.today().slice(0, 7);
    const buy = this.tx().filter(t => t.type === 'despesa' && t.method === this.CARD && t.inst > 1 && (!S.card || t.cardId === S.card));
    return `<div class="filters">${this.sel('card', 'Todos os cartões', this.cards().map(c => [c.id, c.name]))}</div><div class="grid">
    ${cs.map(c => card(`<span class="dot" style="background:${esc(c.color)}"></span>${esc(c.name)}`, this.invMonths(c.id).length ? this.invoices(c.id).map(v => this.invHtml(c, v.ym)).join('') : empty('Nenhuma fatura ainda. Registre uma despesa neste cartão.'))).join('')}
    ${card('Compras parceladas', buy.length ? buy.map(t => { const ps = this.parcels(t), fut = ps.filter(p => p.ym > now), c = this.cd(t.cardId); return `<details class="inv"><summary><b>${esc(t.desc)}</b> <small>${c ? esc(c.name) : ''} · ${t.inst}x</small><span class="meta">${brl(t.amount)}</span></summary><p class="empty">Parcelas futuras: ${fut.length} · ${brl(this.sum(fut, p => p.amount))}</p><ul class="list">${ps.map(p => `<li><span>${p.i}/${p.n} · ${this.mname(p.ym)}</span><span class="meta">${brl(p.amount)}</span></li>`).join('')}</ul></details>`; }).join('') : empty('Nenhuma compra parcelada.'))}</div>`;
  },
  fixas() {
    const T = Store.today(), a = this.bills().sort((x, y) => x.due.localeCompare(y.due));
    return `<div class="toolbar"><button class="btn" data-f="new:conta">+ Nova conta fixa</button></div>${card('Contas fixas e recorrentes', a.length ? `<ul class="list">${a.map(b => { const done = b.status === 'pago', late = !done && b.due < T; return `<li><div class="grow"><b>${esc(b.name)}</b><small>${esc(b.cat)} · ${b.freq} · ${esc(b.method)} · ${done ? 'pago' : late ? 'atrasada' : 'pendente'}${done ? '' : ' · vence ' + dm(b.due)}</small></div><span class="meta">${brl(b.amount)}</span>${done ? '' : `<button class="btn sm" data-f="paybill:${b.id}">Marcar como paga</button>`}${this.acts('conta', b.id)}</li>`; }).join('')}</ul>` : empty('Nenhuma conta fixa cadastrada.'))}`;
  },
  plano() {
    const ym = this.S.ym, bud = Store.get('budgets', {}), by = this.summary(ym).byCat;
    const rows = this.EXP.map(c => {
      const b = +bud[c] || 0, sp = by[c] || 0, pct = b ? sp / b : 0, flag = b && pct >= 1 ? 'Ultrapassou o orçamento' : b && pct >= .8 ? 'Perto do limite' : '';
      return `<li class="bud"><span class="grow">${c}${flag ? ` <span class="tag p-${pct >= 1 ? 'urgente' : 'alta'}">${flag}</span>` : ''}</span><input type="number" step="0.01" min="0" data-f-bud="${c}" value="${b || ''}" placeholder="Orçamento" aria-label="Orçamento de ${c}"><span class="meta">gasto ${brl(sp)} · resta ${b ? brl(b - sp) : '—'} · ${b ? Math.round(pct * 100) + '%' : '—'}</span>${b ? `<div class="bar full"><i style="width:${Math.min(100, pct * 100)}%"></i></div>` : ''}</li>`;
    }).join('');
    const fut = Array.from({ length: 6 }, (_, i) => this.addM(ym, i)).map(m => {
      const f = this.sum(this.cards(), c => this.invoice(c.id, m).total), ct = this.sum(this.bills().flatMap(b => this.occ(b, m).map(() => b.amount)), x => x);
      return `<li><span>${this.mname(m)}</span><span class="meta">faturas ${brl(f)} · contas fixas ${brl(ct)} · <b>${brl(f + ct)}</b></span></li>`;
    }).join('');
    return `<div class="grid">${card('Orçamento de ' + this.mname(ym), `<ul class="list">${rows}</ul>`)}${card('Compromissos dos próximos meses', `<ul class="list">${fut}</ul><p class="empty">Faturas já incluem as parcelas futuras. O valor das compras não é somado de novo.</p>`)}</div>`;
  },
  rel() {
    const ym = this.S.ym, months = Array.from({ length: 12 }, (_, i) => this.addM(ym, i - 11)), s = this.summary(ym);
    let acc = 0;
    const evo = months.map(m => { const x = this.summary(m); acc = this.R(acc + x.saved); return `<li><span>${this.mname(m)}</span><span class="meta">receitas ${brl(x.rec)} · despesas ${brl(x.des)} · economia ${brl(x.saved)} · acumulado ${brl(acc)}</span></li>`; }).join('');
    const perCard = this.cards().map(c => `<li><span>${esc(c.name)}</span><span class="meta">${brl(this.invoice(c.id, ym).total)}</span></li>`).join('');
    const inv = this.cards().flatMap(c => this.invoices(c.id).map(v => ({ c, v }))).sort((a, b) => b.v.ym.localeCompare(a.v.ym));
    const par = this.tx().filter(t => t.type === 'despesa' && t.method === this.CARD && t.inst > 1);
    return `<div class="grid">${card('Receitas, despesas e evolução da economia (12 meses)', this.chart(months) + `<ul class="list">${evo}</ul>`)}
    ${card('Despesas por categoria em ' + this.mname(ym), this.catBars(s.byCat))}
    ${card('Gastos por cartão em ' + this.mname(ym), `<ul class="list">${perCard}</ul>`)}
    ${card('Comparação entre meses', this.cmp(ym))}
    ${card('Histórico de faturas', inv.length ? ul(inv.map(({ c, v }) => `<li><span>${esc(c.name)} · ${this.mname(v.ym)}</span><span class="meta">${v.status} · ${brl(v.total)}</span></li>`)) : empty('Sem faturas.'))}
    ${card('Compras parceladas', par.length ? ul(par.map(t => `<li><span>${esc(t.desc)} (${t.inst}x)</span><span class="meta">${brl(t.amount)}</span></li>`)) : empty('Nenhuma compra parcelada.'))}</div>`;
  },

  /* Formulários */
  dlg(title, fields, vals, save) {
    const d = $('#dlg');
    const inp = ([n, l, t, o, r]) => t === 'select'
      ? `<label class="f">${l}<select name="${n}">${o.map(x => { const [v, tx] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(v)}" ${String(vals[n] ?? '') === String(v) ? 'selected' : ''}>${esc(tx)}</option>`; }).join('')}</select></label>`
      : t === 'area' ? `<label class="f">${l}<textarea name="${n}" rows="2">${esc(vals[n])}</textarea></label>`
      : `<label class="f">${l}<input name="${n}" type="${t}" value="${esc(vals[n])}" ${r ? 'required' : ''} ${t === 'number' ? 'step="0.01" min="0"' : ''}></label>`;
    d.innerHTML = `<form method="dialog" id="ffrm"><h2>${title}</h2>${fields.map(inp).join('')}<p class="empty" id="ferr"></p><div class="row"><button type="button" class="btn ghost" id="cancel">Cancelar</button><button class="btn">Salvar</button></div></form>`;
    d.showModal(); $('#cancel').onclick = () => d.close();
    $('#ffrm').onsubmit = e => { e.preventDefault(); const err = save(Object.fromEntries(new FormData(e.target))); if (err) { $('#ferr').textContent = err; return; } d.close(); render(); };
  },
  form(kind, id) {
    const today = Store.today(), cs = [['', '— nenhum —'], ...this.cards().map(c => [c.id, c.name])];
    const def = { receita: { status: 'recebido', date: today, recur: 'não se repete', cat: 'Salário' }, despesa: { status: 'pago', date: today, method: 'Pix', inst: 1, cat: 'Alimentação' },
      cartao: { color: '#6B0B0C' }, conta: { freq: 'mensal', method: 'Pix', cat: 'Casa', due: today } };
    const col = { receita: 'transactions', despesa: 'transactions', cartao: 'cards', conta: 'bills' }[kind];
    const v = id ? Store.list(col).find(x => x.id === id) : def[kind], pos = x => { x = parseFloat(x); return x > 0 ? x : 0; };
    const day = x => { x = parseInt(x) || 0; return x >= 1 && x <= 31 ? x : 0; };
    if (kind === 'receita') this.dlg(id ? 'Editar receita' : 'Nova receita', [['desc', 'Nome ou descrição', 'text', 0, 1], ['amount', 'Valor (R$)', 'number', 0, 1], ['date', 'Data de recebimento', 'date', 0, 1], ['cat', 'Categoria', 'select', this.INC], ['account', 'Conta ou forma de recebimento', 'text'], ['status', 'Status', 'select', ['recebido', 'previsto']], ['recur', 'Recorrência (apenas informativa)', 'select', ['não se repete', 'semanal', 'mensal', 'anual']], ['notes', 'Observações', 'area']], v,
      d => { d.amount = pos(d.amount); if (!d.amount) return 'Informe um valor maior que zero.'; this.put('transactions', { ...d, type: 'receita', method: 'Conta' }, id); });
    if (kind === 'despesa') this.dlg(id ? 'Editar despesa' : 'Nova despesa', [['desc', 'Nome ou descrição', 'text', 0, 1], ['amount', 'Valor total (R$)', 'number', 0, 1], ['date', 'Data da compra', 'date', 0, 1], ['cat', 'Categoria', 'select', this.EXP], ['method', 'Forma de pagamento', 'select', this.PAY], ['cardId', 'Cartão (se for cartão de crédito)', 'select', cs], ['inst', 'Número de parcelas (1 = à vista)', 'number'], ['firstInv', 'Primeira fatura (opcional; senão, pelo fechamento)', 'month'], ['account', 'Conta utilizada (se não for cartão)', 'text'], ['status', 'Status (no cartão, o pagamento é feito na fatura)', 'select', ['pago', 'pendente']], ['notes', 'Observações', 'area']], v,
      d => { d.amount = pos(d.amount); if (!d.amount) return 'Informe um valor maior que zero.'; const isC = d.method === this.CARD; if (isC && !d.cardId) return 'Escolha o cartão utilizado.';
        d.inst = isC ? Math.max(1, parseInt(d.inst) || 1) : 1; if (!isC) { d.cardId = ''; d.firstInv = ''; } this.put('transactions', { ...d, type: 'despesa' }, id); });
    if (kind === 'cartao') this.dlg(id ? 'Editar cartão' : 'Novo cartão', [['name', 'Nome', 'text', 0, 1], ['inst', 'Instituição', 'text'], ['limit', 'Limite total (R$)', 'number'], ['closing', 'Dia de fechamento (1 a 31)', 'number'], ['due', 'Dia de vencimento (1 a 31)', 'number'], ['color', 'Cor de identificação', 'color']], v,
      d => { this.put('cards', { name: d.name.trim(), inst: d.inst, limit: pos(d.limit), closing: day(d.closing), due: day(d.due), color: d.color }, id); });
    if (kind === 'conta') this.dlg(id ? 'Editar conta fixa' : 'Nova conta fixa', [['name', 'Nome da conta', 'text', 0, 1], ['amount', 'Valor (R$)', 'number', 0, 1], ['cat', 'Categoria', 'select', this.EXP], ['due', 'Próximo vencimento', 'date', 0, 1], ['freq', 'Frequência', 'select', ['mensal', 'semanal', 'anual', 'personalizada', 'única']], ['every', 'Se personalizada: a cada quantos dias?', 'number'], ['method', 'Forma de pagamento', 'select', this.PAY]], v,
      d => { d.amount = pos(d.amount); if (!d.amount) return 'Informe um valor maior que zero.'; this.put('bills', { ...d, every: parseInt(d.every) || 1, day: +d.due.slice(8), status: 'pendente' }, id); });
  },
  pay(cid, ym) {
    const v = this.invoice(cid, ym);
    this.dlg('Pagamento da fatura', [['amount', 'Valor pago (R$)', 'number', 0, 1], ['date', 'Data do pagamento', 'date', 0, 1]], { amount: v.rest || '', date: Store.today() },
      d => { d.amount = parseFloat(d.amount); if (!(d.amount > 0)) return 'Informe um valor maior que zero.'; this.put('payments', { cardId: cid, month: ym, amount: d.amount, date: d.date }); });
  },
  ask(msg, fn) {
    const d = $('#dlg'); d.innerHTML = `<h2>Confirmar exclusão</h2><p>${msg}</p><div class="row"><button class="btn ghost" id="no">Cancelar</button><button class="btn" id="yes">Excluir</button></div>`;
    d.showModal(); $('#no').onclick = () => d.close(); $('#yes').onclick = () => { fn(); d.close(); render(); };
  },
  del(kind, id) {
    if (kind === 'cartao') {
      const n = this.tx().filter(t => t.cardId === id).length;
      if (n) return this.ask(`Este cartão tem ${n} compra(s) registrada(s). Exclua ou mude essas compras antes de excluir o cartão.`, () => {});
      return this.ask('Excluir este cartão e seus pagamentos de fatura?', () => { this.rm('cards', id); Store.set('payments', Store.list('payments').filter(p => p.cardId !== id)); });
    }
    this.ask('Este registro será removido de todas as páginas e dos cálculos.', () => this.rm({ receita: 'transactions', despesa: 'transactions', conta: 'bills' }[kind], id));
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  const [a, x, y] = b.dataset.f.split(':'), S = Fin.S;
  if (a === 'tab') { S.tab = x; S.q = S.cat = S.st = ''; render(); }
  else if (a === 'm') { S.ym = Fin.addM(S.ym, +x); render(); }
  else if (a === 'new') Fin.form(x);
  else if (a === 'edit') Fin.form(x, y);
  else if (a === 'del') Fin.del(x, y);
  else if (a === 'pay') Fin.pay(x, y);
  else if (a === 'paybill') { Fin.payBill(x); render(); }
  else if (a === 'delpay') Fin.ask('Excluir este pagamento? A fatura voltará a ficar com saldo em aberto.', () => Fin.rm('payments', x));
  else if (a === 'cardinv') { S.tab = 'faturas'; S.card = x; render(); }
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if ('fYm' in d) { if (t.value) { Fin.S.ym = t.value; render(); } }
  else if (d.fFlt) { Fin.S[d.fFlt] = t.value; render(); }
  else if (d.fBud) { const b = Store.get('budgets', {}); b[d.fBud] = parseFloat(t.value) || 0; Store.set('budgets', b); render(); }
});

</script>
<script>
/* TRABALHO E CLIENTES — coleções próprias: wclients, wjobs, wprops, wcontracts, wpays, wmeets.
   Integra sem duplicar: reuniões → events; etapas → tasks; projeto → projects; recebimento → transactions. */
const Work = {
  S: { tab: 'geral', cid: null, jid: null, q: '' },
  TABS: [['geral', 'Visão geral'], ['clientes', 'Clientes'], ['projetos', 'Projetos'], ['propostas', 'Propostas'], ['contratos', 'Contratos'], ['pagamentos', 'Pagamentos'], ['reunioes', 'Reuniões']],
  COL: { clientes: 'wclients', projetos: 'wjobs', propostas: 'wprops', contratos: 'wcontracts', pagamentos: 'wpays', reunioes: 'wmeets' },
  SV: ['Projeto de interiores', 'Detalhamento de marcenaria', 'Modelagem 3D', 'Renderização', 'Projeto executivo', 'Consultoria', 'Outros'],
  ST: { prop: ['Em elaboração', 'Enviada', 'Aprovada', 'Recusada', 'Expirada'], job: ['Em andamento', 'Aguardando cliente', 'Pausado', 'Concluído', 'Cancelado'], ctr: ['Em elaboração', 'Assinado', 'Em andamento', 'Concluído', 'Cancelado'], etp: ['Não iniciada', 'Em andamento', 'Concluída'] },
  L(c) { return Store.list(c); },
  find(c, id) { return this.L(c).find(x => x.id === id); },
  cn(id) { return (this.find('wclients', id) || {}).nome || '—'; },
  jn(id) { return (this.find('wjobs', id) || {}).nome || '—'; },
  got(p) { return p.status === 'recebido' ? p.valor : (p.rec || 0); },
  left(p) { return Math.max(0, Math.round((p.valor - this.got(p)) * 100) / 100); },
  kb(n) { return n < 1048576 ? Math.max(1, Math.round(n / 1024)) + ' KB' : (n / 1048576).toFixed(1) + ' MB'; },
  pos(x) { x = parseFloat(x); return x > 0 ? x : 0; },
  sum(a, f) { return Math.round(a.reduce((n, x) => n + (f(x) || 0), 0) * 100) / 100; },
  copts() { return [['', '— selecione —'], ...this.L('wclients').filter(c => !c.arq).map(c => [c.id, c.nome])]; },
  jopts() { return [['', '— selecione —'], ...this.L('wjobs').map(j => [j.id, j.nome + ' · ' + this.cn(j.cliente)])]; },
  norm() { const T = Store.today(); this.L('wprops').forEach(p => { if (p.status === 'Enviada' && p.validade && p.validade < T) Store.update('wprops', p.id, { status: 'Expirada' }); }); },

  /* ---------- formulários (reaproveitam Fin.dlg) ---------- */
  form(kind, id) {
    const col = this.COL[kind], T = Store.today(), v = id ? this.find(col, id) : {};
    const def = { clientes: { tipo: 'Pessoa física', origem: 'Instagram', contato: T }, projetos: { status: 'Em andamento', prio: 'média', inicio: T, servico: this.SV[0] }, propostas: { status: 'Em elaboração', envio: T }, contratos: { status: 'Em elaboração' }, pagamentos: { status: 'pendente', venc: T }, reunioes: { data: T } };
    const C = this.copts(), J = this.jopts();
    const FD = {
      clientes: ['cliente', [['nome', 'Nome completo', 'text', 0, 1], ['tel', 'Telefone', 'tel'], ['email', 'E-mail', 'email'], ['cidade', 'Cidade', 'text'], ['end', 'Endereço (opcional)', 'text'], ['tipo', 'Tipo de cliente', 'select', ['Pessoa física', 'Pessoa jurídica', 'Arquiteto(a) ou parceiro(a)', 'Outro']], ['contato', 'Data do primeiro contato', 'date'], ['origem', 'Origem do contato', 'select', ['Instagram', 'Indicação', 'WhatsApp', 'Site', 'Outro']], ['obs', 'Observações', 'area']]],
      projetos: ['projeto', [['nome', 'Nome do projeto', 'text', 0, 1], ['cliente', 'Cliente', 'select', C], ['servico', 'Tipo de serviço', 'select', this.SV], ['desc', 'Descrição', 'area'], ['inicio', 'Data de início', 'date'], ['prazo', 'Prazo de entrega', 'date'], ['valor', 'Valor contratado (R$)', 'number'], ['status', 'Status', 'select', this.ST.job], ['prio', 'Prioridade', 'select', ['baixa', 'média', 'alta', 'urgente']], ['obs', 'Observações', 'area']]],
      propostas: ['proposta', [['cliente', 'Cliente', 'select', C], ['servico', 'Serviço oferecido', 'text', 0, 1], ['desc', 'Descrição', 'area'], ['valor', 'Valor (R$)', 'number', 0, 1], ['pgto', 'Forma de pagamento', 'text'], ['estimado', 'Prazo estimado', 'text'], ['envio', 'Data de envio', 'date'], ['validade', 'Validade da proposta', 'date'], ['status', 'Status', 'select', this.ST.prop]]],
      contratos: ['contrato', [['cliente', 'Cliente', 'select', C], ['projeto', 'Projeto relacionado', 'select', J], ['valor', 'Valor (R$)', 'number'], ['assinatura', 'Data de assinatura', 'date'], ['prazo', 'Prazo', 'date'], ['cond', 'Condições de pagamento', 'area'], ['status', 'Status', 'select', this.ST.ctr], ['arquivo', 'Arquivo (link ou onde está guardado)', 'text'], ['obs', 'Observações', 'area']]],
      pagamentos: ['pagamento', [['projeto', 'Projeto', 'select', J], ['desc', 'Descrição ou parcela (ex.: 1/3)', 'text', 0, 1], ['valor', 'Valor (R$)', 'number', 0, 1], ['venc', 'Vencimento', 'date', 0, 1]]],
      reunioes: ['reunião', [['cliente', 'Cliente', 'select', C], ['assunto', 'Assunto', 'text', 0, 1], ['data', 'Data', 'date', 0, 1], ['hora', 'Horário', 'time'], ['local', 'Local ou modalidade', 'text'], ['notas', 'Anotações', 'area'], ['prox', 'Próximas providências', 'area']]]
    }[kind];
    Fin.dlg((id ? 'Editar ' : 'Novo(a) ') + FD[0], FD[1], { ...def[kind], ...v }, d => {
      ['nome', 'assunto', 'desc', 'servico'].forEach(k => { if (typeof d[k] === 'string') d[k] = d[k].trim(); });
      if (['clientes', 'projetos'].includes(kind) && !d.nome) return 'Informe o nome.';
      if (kind === 'reunioes' && !d.assunto) return 'Informe o assunto.';
      if (d.valor !== undefined) d.valor = this.pos(d.valor);
      if (['projetos', 'propostas', 'reunioes'].includes(kind) && !d.cliente) return 'Selecione o cliente. Cadastre-o antes, se ainda não existir.';
      if (kind === 'contratos') { const jb = this.find('wjobs', d.projeto); if (!d.cliente || !d.projeto) return 'Selecione o cliente e o projeto deste contrato.'; if (jb && jb.cliente !== d.cliente) return 'O projeto selecionado pertence a outro cliente.'; }
      if (kind === 'pagamentos' && !d.projeto) return 'Selecione o projeto.';
      if (['propostas', 'pagamentos'].includes(kind) && !d.valor) return 'Informe um valor maior que zero.';
      
      const rec = id ? (Store.update(col, id, d), { ...v, ...d }) : Store.add(col, d);
      if (kind === 'reunioes') this.syncEvent(rec);
      if (kind === 'projetos' && rec.projectId) Store.update('projects', rec.projectId, { title: rec.nome });
    });
  },
  syncEvent(m) {
    const e = { title: `Reunião: ${m.assunto} (${this.cn(m.cliente)})`, date: m.data, time: m.hora || '', meetId: m.id }, ex = this.L('events').find(x => x.meetId === m.id);
    ex ? Store.update('events', ex.id, e) : Store.add('events', e);
  },
  stageForm(jid, sid) {
    const j = this.find('wjobs', jid), s = (j.etapas || []).find(x => x.id === sid) || { status: 'Não iniciada' };
    Fin.dlg(sid ? 'Editar etapa' : 'Nova etapa', [['nome', 'Etapa', 'text', 0, 1], ['prazo', 'Prazo', 'date'], ['status', 'Status', 'select', this.ST.etp], ['obs', 'Observações', 'area']], s, d => {
      const et = sid ? j.etapas.map(x => x.id === sid ? { ...x, ...d } : x) : [...(j.etapas || []), { ...d, id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5) }];
      Store.update('wjobs', jid, { etapas: et });
    });
  },
  /* ---------- integrações ---------- */

  fmt(v) { return brl(v || 0); },
  /* ---------- imagens ---------- */
  async prep(f) {

      if (a.tam !== undefined && u.length !== a.tam) throw new Error('Anexo incompleto no backup (' + (a.nome || id) + ').'); if (a.hash && (await this.hashAs(u, a.hash)) === false) throw new Error('Anexo corrompido no backup (' + (a.nome || id) + ').');
      blobs.push([id, a.nome ? new File([u], a.nome, { type: a.tipo || '', lastModified: a.mod || Date.now() }) : new Blob([u], { type: a.tipo || '' })]);
    }
    const faltando = [...this.refs(doc.chaves)].filter(id => !arq[id]); if (faltando.length) av.push(`${faltando.length} anexo(s) citado(s) nos registros não estão no arquivo.`);
    return { doc, chaves: doc.chaves, blobs, av };
  },
  async confirmar(info) {
    let nf = 0; try { nf = (await Files.entries()).length; } catch (e) { }
    return new Promise(res => {
      const d = $('#dlg'), f = a => a.length ? a.map(x => `${esc(x[0])}: ${x[1]}`).join(' · ') : 'sem registros', quando = info.doc.exportadoEm ? new Date(info.doc.exportadoEm).toLocaleString('pt-BR') : 'data desconhecida'; let done = false;
      const fim = v => { if (!done) { done = true; res(v); } };
      d.classList.remove('wide'); d.innerHTML = `<h2>Substituir os dados deste aparelho?</h2><ul class="list"><li><div class="grow"><b>No backup</b><small>${f(this.contar(info.chaves))} · ${info.blobs.length} anexo(s)<br>Exportado em ${quando}</small></div></li><li><div class="grow"><b>Neste aparelho agora</b><small>${f(this.contar(this.atuais()))} · ${nf} anexo(s)</small></div></li></ul>
        <p class="meta" style="white-space:normal;margin:12px 0 0"><b>Tudo o que está neste aparelho será substituído</b> pelo conteúdo do backup, e isso não pode ser desfeito. Se quiser guardar o que existe aqui, exporte antes.</p>${info.av.length ? `<p class="meta" style="white-space:normal;margin:8px 0 0">${info.av.map(esc).join('<br>')}</p>` : ''}
        <div class="row" style="flex-wrap:wrap"><button class="btn ghost" id="bk-pre">Exportar o que há aqui antes</button><button class="btn ghost" id="bk-no">Cancelar</button><button class="btn" id="bk-go">Substituir meus dados</button></div>`;
      d.addEventListener('close', () => fim('no'), { once: true }); d.showModal();
      $('#bk-no').onclick = () => { d.close(); }; $('#bk-go').onclick = () => { fim('go'); d.close(); }; $('#bk-pre').onclick = e => this.onExport(e.target);
    });
  },
  async aplicar(info) {
    const antes = this.atuais(); let idsAntes = []; try { idsAntes = (await Files.entries()).map(e => e[0]); } catch (e) { } const novos = [], limpa = () => Object.keys(localStorage).filter(k => k.startsWith('planner:')).forEach(k => localStorage.removeItem(k));
    try {
      for (const [id, b] of info.blobs) { await Files.put(id, b); const back = await Files.get(id); if (!back || back.size !== b.size) throw new Error('não foi possível guardar um anexo neste aparelho'); if (!idsAntes.includes(id)) novos.push(id); }
      limpa(); Object.entries(info.chaves).forEach(([k, v]) => localStorage.setItem(k, v));
    } catch (e) {
      try { limpa(); Object.entries(antes).forEach(([k, v]) => localStorage.setItem(k, v)); } catch (e2) { }
      for (const id of novos) await Files.del(id).catch(() => { });
      throw new Error((e && e.name === 'QuotaExceededError' ? 'o espaço de armazenamento do navegador não é suficiente' : (e && e.message || e)) + '. Os dados anteriores foram mantidos');
    }
    const manter = new Set(info.blobs.map(x => x[0])); for (const id of idsAntes) if (!manter.has(id)) await Files.del(id).catch(() => { });
  },
  async onImport(file) {
    try { const info = await this.ler(file); if (await this.confirmar(info) !== 'go') return; await this.aplicar(info); notify('Backup restaurado. Recarregando o planner…'); setTimeout(() => location.reload(), 900); }
    catch (e) { notify('Importação não realizada: ' + (e && e.message || e) + ' Nenhum dado foi alterado.'); }
  },
  /* ---------- tela (em Configurações) ---------- */
  async fillInfo() {
    const el = document.getElementById('bkinfo'); if (!el) return; let nf = 0, sz = 0; try { (await Files.entries()).forEach(([, b]) => { nf++; sz += b.size; }); } catch (e) { }
    const n = this.contar(this.atuais()).reduce((a, x) => a + x[1], 0), e2 = document.getElementById('bkinfo'); if (e2) e2.textContent = `Neste aparelho: ${n} registros · ${nf} anexo${nf === 1 ? '' : 's'}${nf ? ' (' + this.mb(sz) + ')' : ''}`;
  },
  card() {
    setTimeout(() => this.fillInfo(), 0); const m = Store.get('backup_meta', null);
    return card('Backup e transferência', `<p style="margin:0 0 10px;font-size:14px">Seus dados ficam <b>só neste aparelho</b>. Para levar do computador para o celular: <b>exporte</b> um backup aqui, passe o arquivo para o outro aparelho e <b>importe</b> lá.</p><p class="meta" id="bkinfo" style="margin:0 0 12px">Calculando…</p>
      <div class="row" style="justify-content:flex-start;margin-top:0;flex-wrap:wrap"><button class="btn" data-bk="export">Exportar backup</button><button class="btn ghost" data-bk="import">Importar backup</button></div><input type="file" id="bkfile" hidden accept=".json,application/json">
      <p class="meta" style="margin:12px 0 0;white-space:normal">${m && m.ultimo ? 'Último backup feito aqui: ' + new Date(m.ultimo).toLocaleString('pt-BR') + '. ' : 'Nenhum backup feito neste aparelho ainda. '}Importar substitui os dados do aparelho. O arquivo contém seus dados pessoais: guarde-o com cuidado.</p>`, '', 'folder');
  }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-bk]'); if (!b) return; if (b.dataset.bk === 'export') Backup.onExport(b); else document.getElementById('bkfile').click(); });
document.addEventListener('change', e => { if (e.target.id === 'bkfile') { const f = e.target.files[0]; e.target.value = ''; Backup.onImport(f); } });

</script>
